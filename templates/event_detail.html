{% extends 'base.html' %}
{% block content %}
  <section class="container single">
    <article class="glass-card large">
      <h1>{{ event.title }}</h1>
      <p class="meta">Date: {{ event.date }} | Venue: {{ event.location }}</p>
      <div class="description">{{ event.description }}</div>
      <div class="actions">
        <a class="btn" href="/">Back</a>
        <a class="btn ghost" href="/api/events/{{ event.pk }}/">API Details</a>
        {% if request.user.is_authenticated %}
          <a class="btn" href="{% url 'register_event' event.pk %}">Register</a>
        {% else %}
          <a class="btn" href="{% url 'login' %}?next={% url 'event_detail' event.pk %}">Login to register</a>
        {% endif %}
      </div>
    </article>
  </section>
{% endblock %}
