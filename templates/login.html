{% extends 'base.html' %}
{% block content %}
  <section class="container">
    <div class="glass-card" style="max-width:420px;margin:0 auto">
      <h2>Sign in</h2>
      <form method="post">
        {% csrf_token %}
        <label>Username</label>
        <input name="username" required class="input" />
        <label>Password</label>
        <input name="password" type="password" required class="input" />
        <div style="margin-top:12px">
          <button class="btn" type="submit">Sign in</button>
          <a class="btn ghost" href="{% url 'signup' %}">Create account</a>
        </div>
      </form>
    </div>
  </section>
{% endblock %}
