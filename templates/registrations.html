{% extends 'base.html' %}
{% block content %}
  <section class="container">
    <h1>Your Registrations</h1>
    <div class="grid">
      {% for reg in registrations %}
      <article class="glass-card">
        <h3>{{ reg.event.title }}</h3>
        <p class="meta">Registered at: {{ reg.registered_at }}</p>
        <div class="actions">
          <a class="btn ghost" href="{% url 'event_detail' reg.event.pk %}">Event</a>
          <a class="btn" href="{% url 'cancel_registration' reg.pk %}">Cancel</a>
        </div>
      </article>
      {% empty %}
      <p>No registrations yet.</p>
      {% endfor %}
    </div>
  </section>
{% endblock %}
